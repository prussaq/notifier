[project]
name = "notifier"
version = "0.1.0"
description = "Notifier CLI application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "load_dotenv==0.1.0",
    "firebase-admin==7.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
notifier = "notifier.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
